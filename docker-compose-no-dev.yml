services:
  db:
    image: mariadb:10.6.4-focal
    command: '--default-authentication-plugin=mysql_native_password'
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - internal-net
    env_file:
      - .env
    ports:
      - 3307:3306

  wordpress:
    depends_on:
      - db
    image: wordpress:6.5.3
    volumes:
      - ./docker-files/.htaccess:/var/www/html/.htaccess
    networks:
      - internal-net
      - wordpress-net
    ports:
      - ${VIRTUAL_PORT}:80
    restart: unless-stopped
    env_file:
      - .env

networks:
  internal-net:
  wordpress-net:
    name: ${NETWORK:-wordpress-net}
    external: ${USE_EXTERNAL_NETWORK:-false}

volumes:
  db-data:
